<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Exemplo 1.3: formularios HTML</title>
        <link rel="stylesheet" href="exemplo03.css" type="text/css">
    </head>
    <body>
        <form>
            <fieldset>
                <legend>Datos persoais</legend>
                <input class="senEtiqueta" type="text" name="nome" placeholder="Introduza o seu nome">
                <input class="senEtiqueta" type="text" name="apelido1" placeholder="Introduza o seu primeiro apelido">
                <input class="senEtiqueta" type="text" name="apelido2" placeholder="Introduza o seu segundo apelido">
            </fieldset>
            <fieldset>
                <legend>Outros datos</legend>

                <label id="lContrasinal" for="contrasinal">Contrasinal</label>
                <input id="contrasinal" name="contrasinal" type="password">

                <input name="captcha" type="checkbox">
                <label for="captcha">Non son un robot</label>

                <input name="estadoCivil" id="casado" type="radio">
                <label for="casado">Casad@</label>
                <input name="estadoCivil" id="parellaDeFeito" type="radio">
                <label for="parellaDeFeito">Parella de feito</label>
                <input name="estadoCivil" id="viuvo" type="radio">
                <label for="viuvo">Viúv@</label>
                <input name="estadoCivil" id="solteiro" type="radio">
                <label for="solteiro">Solteir@</label>

                <textarea name="observacions" rows="4" cols="20" placeholder="Indique as súas observacións"></textarea>

                <select name="provincias" size="4" multiple>
                    <option value="aCoruna" selected>A Coruña</option>
                    <option value="lugo">Lugo</option>
                    <option value="ourense" selected>Ourense</option>
                    <option value="pontevedra">Pontevedra</option>
                </select>

                <button type="button">Enviar</button>
                <button type="button">Cancelar</button>
            </fieldset>
        </form>
    </body>
</html>
