<!DOCTYPE html>
<html lang="es">

<head>
    <title>Exemplo 1.9: tooltips</title>
    <link rel="stylesheet" href="exemplo09.css" type="text/css">
</head>

<body>
    <h1>Exemplo de Tooltips</h1>
    <p>Pasa o rato por enriba do texto subliñado para ver o tooltip:</p>

    <!-- Contedor do tooltip -->
    <div class="tooltip">Pasa por aquí
        <!-- Texto que aparecerá no tooltip -->
        <span class="tooltiptext">Este é o texto do tooltip.</span>
    </div>
</body>

</html>
