<!DOCTYPE html>
<html lang="es">

<head>
    <title>Exemplo 1.5: selectores de atributos CSS</title>
    <link rel="stylesheet" href="exemplo05.css" type="text/css">
</head>

<body>
    <a id="enlace" href="http://www.google.com">Ir a Google</a>
    <img src="amsterdam.png" alt="Texto alternativo" />
    <table>
        <tr>
            <th>Etiqueta</th>
            <th colspan="2">Descrición</th>
        </tr>
        <tr>
            <td rowspan="3">table</td>
            <td colspan="2">Emprégase para definir táboas</td>
        </tr>
        <tr>
            <td>Atributo</td>
            <td>Descrición</td>
        </tr>
        <tr>
            <td>border="medida"</td>
            <td>Permite indicar a largura do bordo da táboa</td>
        </tr>
    </table>
</body>

</html>
